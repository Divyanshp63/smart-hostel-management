# Server Configuration (Port 2007)
server.port=${PORT:2007}
server.address=0.0.0.0

# Application Name
spring.application.name=hostel-management

# Database Connection Details (Aiven MySQL via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-2fce9593-divyanshpaliwal950-458c.k.aivencloud.com:17152/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Enabled for Thymeleaf rendering of entity relationships
spring.jpa.open-in-view=true

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Session Management Configuration
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=SMART_HOSTEL_SESSION

# JWT Security Configuration (Retained for REST API compatibility)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.hostel.management=INFO
logging.level.org.springframework.security=WARN
